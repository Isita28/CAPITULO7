<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Análisis de resultados de examen</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Análisis de resultados de examen</h1><p>Introduce 10 resultados: 1 = aprobado, 2 = reprobado.</p><input id="a" style="width:80%" value="1,1,2,1,1,1,1,2,1,1"><button onclick="run()">Analizar</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let a=document.getElementById('a').value.split(',').map(x=>x.trim());if(a.length!==10||a.some(x=>x!=='1'&&x!=='2')){document.getElementById('o').textContent='Ingresa diez valores 1 o 2';return;}let ap=0,r=0,i=0;while(i<10){a[i++]==='1'?ap++:r++;}document.getElementById('o').innerHTML='Aprobados: '+ap+'<br>Reprobados: '+r+(ap>8?'<br><b>Reconocimiento para el instructor</b>':'');}</script></body></html>
