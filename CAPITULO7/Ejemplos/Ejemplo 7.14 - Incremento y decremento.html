<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preincremento y postincremento</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Preincremento y postincremento</h1><p>Compara c++ y ++c.</p><button onclick="run()">Ejecutar</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let c=5,p=c++,d=c;c=5;let q=++c,e=c;document.getElementById('o').innerHTML='Postincremento: valor usado '+p+', valor final '+d+'<br>Preincremento: valor usado '+q+', valor final '+e;}</script></body></html>
