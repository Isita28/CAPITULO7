<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promedio de una clase</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Promedio de una clase</h1><p>Introduce diez calificaciones separadas por coma.</p><input id="a" style="width:80%" value="90,80,75,100,85,70,95,88,92,80"><button onclick="run()">Calcular</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let a=document.getElementById('a').value.split(',').map(Number);if(a.length!==10||a.some(n=>n<0||n>100||!Number.isFinite(n))){document.getElementById('o').textContent='Introduce exactamente 10 calificaciones entre 0 y 100.';return;}let i=0,s=0;while(i<a.length)s+=a[i++];document.getElementById('o').innerHTML='Total: '+s+'<br><b>Promedio: '+(s/i).toFixed(2)+'</b>';}</script></body></html>
