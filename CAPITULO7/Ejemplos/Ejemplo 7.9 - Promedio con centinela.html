<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promedio con centinela</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Promedio con centinela</h1><p>Captura calificaciones de 0 a 100. Usa -1 para terminar.</p><input id="n" type="number" value="85"><button onclick="add()">Agregar</button><button onclick="end()">Terminar</button><div id="l" class="resultado"></div><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>let a=[];function add(){let n=+document.getElementById('n').value;if(n<0||n>100){document.getElementById('o').textContent='Valor inválido';return;}a.push(n);document.getElementById('l').textContent='Calificaciones: '+a.join(', ');}function end(){if(!a.length){document.getElementById('o').textContent='No se capturaron calificaciones';return;}let s=0,i=0;while(i<a.length)s+=a[i++];document.getElementById('o').innerHTML='Cantidad: '+i+'<br><b>Promedio: '+(s/i).toFixed(2)+'</b>';}</script></body></html>
