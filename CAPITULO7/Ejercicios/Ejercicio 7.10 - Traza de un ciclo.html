<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traza de un ciclo</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Traza de un ciclo</h1><p>Calcula cuadrados del 1 al 10 y muestra el acumulado.</p><button onclick="run()">Ejecutar traza</button><div id="o"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let x=1,s=0,h='<table><tr><th>x</th><th>x²</th><th>Total</th></tr>';while(x<=10){s+=x*x;h+='<tr><td>'+x+'</td><td>'+x*x+'</td><td>'+s+'</td></tr>';x++;}document.getElementById('o').innerHTML=h+'</table><p class=resultado>Suma: '+s+'</p>';}</script></body></html>
