<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rendimiento de combustible</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Rendimiento de combustible</h1><p>Captura kilómetros y litros por recorrido.</p><label>Km <input id="k" type="number" value="350"></label><label>Litros <input id="l" type="number" value="28" step=".1"></label><button onclick="add()">Agregar</button><button onclick="sumar()">Resumen</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>let a=[];function add(){let k=+document.getElementById('k').value,l=+document.getElementById('l').value;if(k<=0||l<=0){document.getElementById('o').textContent='Ambos valores deben ser positivos';return;}a.push([k,l]);document.getElementById('o').textContent='Recorrido '+a.length+': '+(k/l).toFixed(2)+' km/L';}function sumar(){let k=0,l=0;a.forEach(r=>{k+=r[0];l+=r[1]});document.getElementById('o').innerHTML=a.length?'Total: '+k+' km / '+l+' L<br><b>Promedio: '+(k/l).toFixed(2)+' km/L</b>':'Agrega un recorrido';}</script></body></html>
