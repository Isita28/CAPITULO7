<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas e ingresos</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Ventas e ingresos</h1><p>Agrega ventas y calcula una cuota base de $200 más 9% de comisión.</p><input id="v" type="number" value="239.99"><button onclick="add()">Agregar venta</button><button onclick="end()">Calcular</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>let a=[];function add(){a.push(+document.getElementById('v').value);document.getElementById('o').textContent='Ventas registradas: '+a.length;}function end(){let s=0,i=0;while(i<a.length)s+=a[i++];document.getElementById('o').innerHTML='Venta total: $'+s.toFixed(2)+'<br><b>Ingreso: $'+(200+s*.09).toFixed(2)+'</b>';}</script></body></html>
