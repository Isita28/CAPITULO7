<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cálculo de comisión</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Cálculo de comisión</h1><p>Calcula ingreso con cuota base y porcentaje configurable.</p>Venta ($) <input id="v" type="number" value="5000"> Base ($) <input id="b" type="number" value="200"> Comisión (%) <input id="p" type="number" value="9"><button onclick="run()">Calcular</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let v=+document.getElementById('v').value,b=+document.getElementById('b').value,p=+document.getElementById('p').value;document.getElementById('o').innerHTML='Comisión: $'+(v*p/100).toFixed(2)+'<br><b>Ingreso: $'+(b+v*p/100).toFixed(2)+'</b>';}</script></body></html>
