<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nómina de tres empleados</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Nómina de tres empleados</h1><p>Las primeras 40 horas se pagan normal; las horas extra a 1.5 veces la tarifa.</p><table><tr><th>Empleado</th><th>Horas</th><th>Tarifa</th></tr><tr><td>1</td><td><input id="h1" type="number" value="38"></td><td><input id="t1" type="number" value="100"></td></tr><tr><td>2</td><td><input id="h2" type="number" value="45"></td><td><input id="t2" type="number" value="120"></td></tr><tr><td>3</td><td><input id="h3" type="number" value="42"></td><td><input id="t3" type="number" value="95"></td></tr></table><button onclick="run()">Calcular</button><div id="o"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let s='<table><tr><th>Empleado</th><th>Horas extra</th><th>Sueldo bruto</th></tr>';for(let i=1;i<=3;i++){let h=+document.getElementById('h'+i).value,t=+document.getElementById('t'+i).value;s+='<tr><td>'+i+'</td><td>'+Math.max(0,h-40)+'</td><td>$'+(Math.min(h,40)*t+Math.max(0,h-40)*t*1.5).toFixed(2)+'</td></tr>';}document.getElementById('o').innerHTML=s+'</table>';}</script></body></html>
