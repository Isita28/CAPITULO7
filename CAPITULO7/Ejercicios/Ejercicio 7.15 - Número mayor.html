<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encontrar el número mayor</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Encontrar el número mayor</h1><p>Introduce diez dígitos separados por coma.</p><input id="a" style="width:80%" value="3,8,1,9,2,5,7,4,0,6"><button onclick="run()">Buscar máximo</button><div id="o" class="resultado"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let a=document.getElementById('a').value.split(',').map(Number);if(a.length!==10||a.some(n=>!Number.isInteger(n)||n<0||n>9)){document.getElementById('o').textContent='Ingresa diez dígitos del 0 al 9';return;}let i=1,m=a[0];while(i<10){if(a[i]>m)m=a[i];i++;}document.getElementById('o').innerHTML='Procesados: '+i+'<br><b>Máximo: '+m+'</b>';}</script></body></html>
