<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabla de múltiplos</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Tabla de múltiplos</h1><p>Genera una tabla usando un ciclo.</p><button onclick="run()">Generar tabla</button><div id="o"></div><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let h='<table><tr><th>N</th><th>N×10</th><th>N×100</th><th>N×1000</th></tr>';let n=1;while(n<=6){h+='<tr><td>'+n+'</td><td>'+n*10+'</td><td>'+n*100+'</td><td>'+n*1000+'</td></tr>';n++;}document.getElementById('o').innerHTML=h+'</table>';}</script></body></html>
