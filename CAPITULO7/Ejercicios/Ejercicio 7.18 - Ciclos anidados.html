<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciclos anidados</title><style>body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:25px}main{max-width:950px;margin:auto;background:white;padding:24px;border-radius:10px}h1,h2{color:#174a7e}button,input{padding:8px;margin:5px}button{background:#1d4ed8;color:white;border:0;border-radius:5px;cursor:pointer}.resultado{background:#eff6ff;padding:12px;margin-top:15px}table{border-collapse:collapse;width:100%;margin-top:15px}td,th{border:1px solid #94a3b8;padding:8px;text-align:center}th{background:#dbeafe}</style></head><body><main><h1>Ciclos anidados</h1><p>Genera una matriz de símbolos con ciclos while anidados.</p><button onclick="run()">Mostrar patrón</button><pre id="o" class="resultado"></pre><p style="text-align:center;margin-top:28px"><a href="../Menu Principal.html">← Volver al menú principal</a></p></main><script>function run(){let s='',f=10;while(f>=1){let c=1;while(c<=10){s+=(f*2>c?'&lt;':'&gt;')+' ';c++;}s+='\n';f--;}document.getElementById('o').innerHTML=s;}</script></body></html>
